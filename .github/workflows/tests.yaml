name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pytest-homeassistant-custom-component pins the matching HA release.
          - name: HA 2024.4.0
            python-version: "3.12"
            pytest-ha: pytest-homeassistant-custom-component==0.13.111
            legacy: true
          - name: HA 2026.8.1
            python-version: "3.14"
            pytest-ha: pytest-homeassistant-custom-component==0.13.355
            legacy: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_test_ha_2024_4.txt
      - name: Install HA 2024.4 test dependencies
        if: matrix.legacy
        run: |
          pip install -r requirements_test_ha_2024_4.txt
          pip install --no-deps "${{ matrix.pytest-ha }}"
      - name: Install latest HA test dependencies
        if: matrix.legacy == false
        run: pip install -r requirements_test.txt "${{ matrix.pytest-ha }}"
      - run: python -m pytest -q
